appId: io.studyat.app
productName: StudyAt
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: assets
    to: assets
    filter:
      - '**/*'
asarUnpack:
  - node_modules/sql.js/dist/*.wasm
win:
  target:
    - nsis
  icon: assets/icons/icon.ico
# Per-user only: installs to %LOCALAPPDATA% with no admin prompt, and never runs elevated after.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StudyAt
  runAfterFinish: false
  artifactName: StudyAt Setup ${version}.exe
